# Custom alacritty terminal configuration
# Inspired by Adwaita Dark
[terminal]
shell = "/run/current-system/sw/bin/zsh"

[window]
opacity = 0.95

[font]
size = 12.0

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.bold_italic]
family = "JetBrains Mono"
style = "SemiBold Italic"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.cursor]
cursor = '#ffffff'
text = '#1d1d20'

[colors.primary]
background = '#20252c'
foreground = '#a1a9b7'

[colors.selection]
background = '#ffffff'
text = '#5e5c64'

[colors.normal]
black = '#241f31'
red = '#c01c28'
green = '#2ec27e'
yellow = '#f5c211'
blue = '#1e78e4'
magenta = '#9841bb'
cyan = '#0ab9dc'
white = '#f6f5f4'

[colors.bright]
black = '#5e5c64'
red = '#ed333b'
green = '#57e389'
yellow = '#f8e45c'
blue = '#51a1ff'
magenta = '#ff06b5'
cyan = '#4fd2fd'
white = '#ffffff'
