# Custom alacritty theme - Everforest Medium
[terminal]
shell = "/run/current-system/sw/bin/zsh"

[window]
opacity = 0.95

[font]
size = 12.0

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.bold_italic]
family = "JetBrains Mono"
style = "SemiBold Italic"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.cursor]
cursor = '#e69875'
text = '#4c3743'

[colors.primary]
background = '#2d353b'
foreground = '#d3c6aa'

[colors.selection]
background = '#4c3743'
text = '#d3c6aa'

[colors.normal]
black = '#7a8478'
red = '#e67e80'
green = '#a7c080'
yellow = '#dbbc7f'
blue = '#7fbbb3'
magenta = '#d699b6'
cyan = '#83c092'
white = '#f2efdf'

[colors.bright]
black = '#a6b0a0'
red = '#f85552'
green = '#8da101'
yellow = '#dfa000'
blue = '#3a94c5'
magenta = '#df69ba'
cyan = '#35a77c'
white = '#fffbef'
